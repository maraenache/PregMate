<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recapitulare Geometrie — curs interactiv de recapitulare a noțiunilor fundamentale de geometrie, cu fișe de teorie și teste grilă." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28 L16 4 L28 28 Z' fill='none' stroke='%2322918D' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Recapitulare Geometrie</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('recapitulare-geometrie:v1') || 'null');
        var t = s && (s.theme === 'dark' || s.theme === 'light') ? s.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-skip>Sari la conținut</a>
    <div id="app"></div>
    <noscript>Această aplicație necesită JavaScript activat în browser.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
